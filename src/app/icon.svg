<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="VTT Global" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Dashboard favicon — the VTT Global mark reduced for 16px legibility.

    The full brand mark (components/layout/BrandLogo.tsx) carries a rotating
    ring, three ascending bars and a drawn chevron. None of that survives at
    favicon size, so this keeps only the two things that still read: the
    hexagonal shield silhouette and a heavy V. The bars are kept at low
    opacity, where they register as texture at 16px and resolve into a chart
    at 32px and above.

    Placed at app/icon.svg, Next.js serves it automatically and injects the
    link tag — no metadata configuration needed.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="c">
      <path d="M16 1.4 28.6 8.7v14.6L16 30.6 3.4 23.3V8.7z"/>
    </clipPath>
  </defs>

  <!-- shield -->
  <path d="M16 1.4 28.6 8.7v14.6L16 30.6 3.4 23.3V8.7z" fill="url(#g)"
        stroke="#0f2f6b" stroke-width="1" stroke-linejoin="round"/>

  <!-- ascending series: texture at 16px, a bar chart at 32px+ -->
  <g clip-path="url(#c)" fill="#ffffff" opacity=".26">
    <rect x="8.4" y="18.2" width="3.1" height="6" rx="1"/>
    <rect x="14.4" y="14.6" width="3.1" height="9.6" rx="1"/>
    <rect x="20.4" y="11" width="3.1" height="13.2" rx="1"/>
  </g>

  <!-- the V: heavy enough to survive downscaling -->
  <path d="M9.6 10.2 16 23.2l6.4-13" fill="none" stroke="#ffffff"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- accent -->
  <circle cx="24.4" cy="8.6" r="2.1" fill="#2dd4bf" stroke="#0f2f6b" stroke-width=".8"/>
</svg>
